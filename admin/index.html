<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Portfolio</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white; font-family: 'Poppins', sans-serif; }
    .login-card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 100%; max-width: 340px; margin: 0 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 1.5rem; color: #f8fafc; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: white; box-sizing: border-box; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { width: 100%; padding: 12px; margin-top: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #error { margin-top: 14px; font-size: 0.88rem; color: #ef4444; line-height: 1.4; }
    .back-link { display: inline-block; margin-top: 16px; color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: white; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email" required autocomplete="username">
    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
    <button id="loginBtn" onclick="login()">Login</button>
    <p id="error"></p>
    <a href="../" class="back-link">← Back to Portfolio</a>
  </div>

  <script src="../config.js"></script>
  <script>
    // Handle Enter key on input fields
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        errEl.innerText = 'Please enter both email and password';
        return;
      }

      errEl.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Logging in...';

      const API_URL = window.API_BASE_URL || window.API_URL || 'https://YOUR-RENDER-SERVICE.onrender.com/api';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password})
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.token) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = 'dashboard.html';
        } else {
          errEl.innerText = data.message || 'Invalid credentials';
        }
      } catch (err) {
        console.error('Login error:', err);
        errEl.innerText = 'Unable to connect to server. If the backend is waking up, please wait 30 seconds and try again.';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Login';
      }
    }
  </script>
</body>
</html>
